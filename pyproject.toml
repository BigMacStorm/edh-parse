[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edhparse"
version = "2.0.0"
description = "EDH deck tooling: EDHREC averages, Scryfall pricing, stock ownership, and HTML reports"
readme = "meta/README.md"
requires-python = ">=3.10"
dependencies = [
    "progressbar2",
    "requests",
    "requests-cache",
    "ijson",
    "weasyprint",
    "xhtml2pdf",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "typer",
    "numpy",
    "scipy",
    "beautifulsoup4",  # Moxfield deck pages (edhparse/services/moxfield.py)
    "selenium",  # Moxfield is rendered client-side, so it needs a real browser
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]  # httpx2: required by fastapi/starlette's TestClient

[project.scripts]
edhparse = "edhparse.cli_app:main"
edhparse-web = "edhparse.web.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edhparse*", "core*", "clients*", "renderers*", "utils*"]

[tool.setuptools.package-data]
edhparse = [
    "web/templates/*.html",
    "web/templates/workflows/*.html",
    "web/static/*",
    "web/static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
