{% extends "base.html" %}
{% block title %}{{ meta.title }} · edh-parse{% endblock %}
{% block body %}
  <h1 class="brand">{{ meta.title }}</h1>
  <p class="tagline">{{ meta.blurb }}</p>
  <div class="panel">
    <form method="post" action="/run/compare">
      <div class="row">
        <label for="url_a">Commander A (URL or slug)</label>
        <input type="text" id="url_a" name="url_a" required>
      </div>
      <div class="row">
        <label for="url_b">Commander B (URL or slug)</label>
        <input type="text" id="url_b" name="url_b" required>
      </div>
      <div class="row">
        <label for="min_inclusion">Min inclusion % (optional)</label>
        <input type="number" step="0.1" id="min_inclusion" name="min_inclusion">
      </div>
      <div class="checks">
        <label><input type="checkbox" name="fresh_cache" value="true"> Fresh cache</label>
      </div>
      <div class="actions">
        <button type="submit">Run</button>
        <a class="btn btn-ghost" href="/">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
