{% extends "base.html" %}
{% block title %}{{ meta.title }} · edh-parse{% endblock %}
{% block body %}
  <h1 class="brand">{{ meta.title }}</h1>
  <p class="tagline">{{ meta.blurb }}</p>
  <div class="panel">
    <form method="post" action="/run/wipcoms">
      <div class="row">
        <label for="input_file">Wantcoms / commander list</label>
        <input type="text" id="input_file" name="input_file" value="{{ defaults.wantcoms }}">
      </div>
      <div class="row">
        <label for="output_dir">Output directory</label>
        <input type="text" id="output_dir" name="output_dir" value="wipcoms">
      </div>
      <div class="row">
        <label for="max_themes">Max themes</label>
        <input type="number" id="max_themes" name="max_themes" value="5">
      </div>
      <div class="row">
        <label for="min_inclusion">Min inclusion %</label>
        <input type="number" step="0.1" id="min_inclusion" name="min_inclusion" value="5">
      </div>
      <div class="checks">
        <label><input type="checkbox" name="singleton_after" value="true"> Singletonize after fetch</label>
        <label><input type="checkbox" name="fresh_cache" value="true"> Fresh cache</label>
      </div>
      <div class="actions">
        <button type="submit">Run</button>
        <a class="btn btn-ghost" href="/">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
