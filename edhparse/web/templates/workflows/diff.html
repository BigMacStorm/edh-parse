{% extends "base.html" %}
{% block title %}{{ meta.title }} · edh-parse{% endblock %}
{% block body %}
  <h1 class="brand">{{ meta.title }}</h1>
  <p class="tagline">{{ meta.blurb }}</p>
  <div class="panel">
    <form method="post" action="/run/diff">
      <div class="row">
        <label for="directory">Directory with *_old / *_new pairs</label>
        <input type="text" id="directory" name="directory" required>
      </div>
      <div class="row">
        <label for="stock">Stock CSV</label>
        <input type="text" id="stock" name="stock" value="{{ defaults.stock }}" required>
      </div>
      <div class="checks">
        <label><input type="checkbox" name="fresh_cache" value="true"> Fresh cache</label>
      </div>
      <div class="actions">
        <button type="submit">Run</button>
        <a class="btn btn-ghost" href="/">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
