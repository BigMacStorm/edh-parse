{% extends "base.html" %}
{% block title %}{{ meta.title }} · edh-parse{% endblock %}
{% block body %}
  <h1 class="brand">{{ meta.title }}</h1>
  <p class="tagline">{{ meta.blurb }}</p>
  <div class="panel">
    <form method="post" action="/run/pivot">
      <div class="row">
        <label for="decklist">Decklist</label>
        <input type="text" id="decklist" name="decklist" required>
      </div>
      <div class="row">
        <label for="output">Output HTML</label>
        <input type="text" id="output" name="output" value="outputs/pivot.html">
      </div>
      <div class="row">
        <label for="min_price">Min card price</label>
        <input type="number" step="0.01" id="min_price" name="min_price" value="5">
      </div>
      <div class="row">
        <label for="min_inclusion">Min inclusion %</label>
        <input type="number" step="0.1" id="min_inclusion" name="min_inclusion" value="0">
      </div>
      <div class="row">
        <label for="top">Top N commanders</label>
        <input type="number" id="top" name="top" value="40">
      </div>
      <div class="checks">
        <label><input type="checkbox" name="fresh_cache" value="true"> Fresh cache</label>
      </div>
      <div class="actions">
        <button type="submit">Run</button>
        <a class="btn btn-ghost" href="/">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
